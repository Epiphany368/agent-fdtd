[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fdtd"
version = "1.0.0"
description = "AgentFDTD (v1.0.0): Zero-trust machine-verified FDTD simulation and inverse-design platform with MCP server"
readme = "mcp_server/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
# Kept as an explicit extra as well as a runtime dependency: `pip install -e .`
# must install the entry point as documented, and `pip install -e .[mcp]` is the
# intent-revealing form. There is no model SDK dependency of any kind.
mcp = ["mcp>=1.0,<2"]

[project.scripts]
agent-fdtd-mcp = "mcp_server.cli:main"
torchfdtd-platform-mcp = "mcp_server.cli:main"

[tool.setuptools]
packages = ["mcp_server"]
